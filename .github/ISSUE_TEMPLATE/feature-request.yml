name: Feature or improvement
description: Suggest a reusable improvement for dashboards and internal tools.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: Search existing requests first. Explain the product need using neutral examples. You do not need to provide code.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task and where the existing library falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should someone be able to do? Include relevant keyboard and mobile expectations.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Where could this be reused?
      description: Describe the kinds of internal tools that would benefit, without client information.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing components considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Mention framework needs, API changes or effects on existing projects if known.
