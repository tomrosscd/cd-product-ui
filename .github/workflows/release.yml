name: Release archive
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  archive:
    name: Build and attach verified archive
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
      - name: Refuse to replace an existing release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') })
              core.setFailed('This release already exists. Never replace its archive or checksum.')
            } catch (error) {
              if (error.status !== 404) throw error
            }
      - name: Build and hash the archive
        run: |
          pnpm pack --pack-destination artifacts
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
      - name: Attach the archive and checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
