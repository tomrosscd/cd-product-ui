name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Formatting
        run: pnpm format:check

      - name: Tokens, types, lint, unit/browser tests, build, CSS surface, static Storybook
        run: pnpm check

      - name: Public API surface check
        run: pnpm api:check

      - name: Registry token drift check
        run: pnpm registry:check

      - name: Dark-theme story tests
        run: pnpm test:dark

      - name: Coverage report
        run: pnpm test:coverage

      - name: Packed-archive consumer check
        run: pnpm package:check

      - name: Next.js consumer check
        run: pnpm next:check
